<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kastikkeet / Sauces — Dewon</title>
<!-- A standalone widget page, not linked from the site: kept out of search so it does not compete with the real pages. -->
<meta name="robots" content="noindex, follow">
<style>
  :root{
    --bg:#f6f1e7;
    --ink:#1c1712;
    --ink-dim:#6b6156;
    --card:#fffdf8;
    --line:#e6ddcc;
    --accent:#c24d0e;
    --radius:18px;
    --font: "Archivo", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font); -webkit-font-smoothing:antialiased;
  }

  .sauces{
    max-width:1120px; margin-inline:auto;
    padding: clamp(2.5rem,5vw,4.5rem) clamp(1rem,4vw,2.5rem);
  }

  /* ── header row: title + language toggle ─────────────────── */
  .sauces-head{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
    gap:1rem 1.5rem; margin-bottom: clamp(1.8rem,4vw,3rem);
  }
  .sauces-title{
    margin:0; font-weight:800; letter-spacing:-.01em;
    font-size: clamp(1.9rem, 1.4rem + 2.4vw, 3.1rem); line-height:1.05;
  }
  .sauces-title::after{
    content:""; display:block; width:56px; height:4px; margin-top:.7rem;
    background:var(--accent); border-radius:2px;
  }

  .lang-toggle{
    display:inline-flex; background:#efe6d4; border-radius:999px; padding:4px;
    gap:2px; flex:none;
  }
  .lang-toggle button{
    appearance:none; border:0; cursor:pointer;
    min-width:52px; padding:.5rem .85rem; border-radius:999px;
    font:inherit; font-weight:700; font-size:.8rem; letter-spacing:.08em;
    color:#7c7060; background:transparent; transition:background .18s, color .18s;
  }
  .lang-toggle button:hover{ color:var(--ink); }
  .lang-toggle button[aria-pressed="true"]{ background:var(--accent); color:#fff; }

  /* ── responsive grid: 2 → 3 → 4 columns ──────────────────── */
  .sauces-grid{
    display:grid; gap: clamp(1rem,2.5vw,2rem);
    /* minmax(0,…) so a long sauce name wraps instead of pushing the
       columns past a narrow phone screen. */
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  @media (min-width:640px){ .sauces-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
  @media (min-width:960px){ .sauces-grid{ grid-template-columns:repeat(4,minmax(0,1fr)); } }

  .sauce{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding: clamp(.9rem,2vw,1.4rem) clamp(.7rem,2vw,1.2rem) clamp(1rem,2vw,1.3rem);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .sauce:hover{ transform:translateY(-4px); box-shadow:0 14px 30px -12px rgba(60,40,20,.28); }

  .sauce .bowl{
    width:100%; max-width:160px; height:auto; display:block;
    filter:drop-shadow(0 10px 14px rgba(50,30,15,.16));
  }
  .sauce-name{
    margin-top:.9rem; font-weight:700; line-height:1.3; overflow-wrap:anywhere; hyphens:auto;
    font-size: clamp(.82rem, .78rem + .25vw, .96rem);
  }
  .sauce-name .g{ color:var(--ink-dim); font-weight:600; }

  .sauces-note{
    margin-top: clamp(1.6rem,3vw,2.4rem); color:var(--ink-dim);
    font-size:.85rem; max-width:60ch;
  }
</style>
</head>
<body>

<section class="sauces" id="sauces">
  <div class="sauces-head">
    <h2 class="sauces-title" data-sauce-header>Kastikkeet</h2>
    <div class="lang-toggle" role="group" aria-label="Kieli / Language">
      <button type="button" data-lang="fi" aria-pressed="true">FI</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <div class="sauces-grid" data-sauce-grid></div>

  <p class="sauces-note" data-sauce-note></p>
</section>

<script src="assets/js/sauces-page.js"></script>

</body>
</html>
